<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none">
  <defs>
    <radialGradient id="glow" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#ff6b00" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#090909" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff6b00" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ff6b00" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1f1f1f" stroke-width="1" />
    </pattern>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#d4d4d4" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#090909" />
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.6" />
  <rect width="1200" height="630" fill="url(#glow)" />

  <!-- Outer frame -->
  <rect x="24" y="24" width="1152" height="582" rx="20" stroke="#262626" stroke-width="2" />

  <!-- Brand badge -->
  <g transform="translate(80, 80)">
    <rect width="184" height="40" rx="20" fill="#141417" stroke="#262626" stroke-width="1" />
    <circle cx="20" cy="20" r="4" fill="#ff6b00" />
    <text x="36" y="25" fill="#a3a3a3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" letter-spacing="1.5">OPEN VAULT</text>
  </g>

  <!-- Logo and title -->
  <text x="80" y="200" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="800" letter-spacing="-1">
    Workflow <tspan fill="#ff6b00">Vault</tspan>
  </text>

  <!-- Subtitle -->
  <text x="80" y="270" fill="#a3a3a3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="500">
    Production-ready AI automation blueprints &amp; developer recipes.
  </text>
  <text x="80" y="310" fill="#737373" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400">
    n8n · Claude &amp; AI Agents · Cloudflare Workers · Make · GitHub Actions · Stripe Webhooks
  </text>

  <!-- Visual pipeline / node diagram preview on right side -->
  <g transform="translate(740, 160)">
    <rect width="380" height="360" rx="16" fill="#111111" stroke="#262626" stroke-width="1.5" />
    
    <!-- Code header bar -->
    <rect width="380" height="42" rx="16" fill="#181818" />
    <circle cx="24" cy="21" r="5" fill="#ff5f56" />
    <circle cx="42" cy="21" r="5" fill="#ffbd2e" />
    <circle cx="60" cy="21" r="5" fill="#27c93f" />
    <text x="85" y="26" fill="#737373" font-family="monospace" font-size="13" font-weight="600">pipeline.config.json</text>

    <!-- Node network inside card -->
    <!-- Node 1: Webhook Trigger -->
    <rect x="30" y="70" width="140" height="60" rx="8" fill="#181818" stroke="#333333" stroke-width="1" />
    <text x="45" y="96" fill="#ff6b00" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">TRIGGER</text>
    <text x="45" y="116" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">POST /webhook</text>

    <!-- Connecting line 1 to 2 -->
    <path d="M 170 100 L 210 100 L 210 170 L 230 170" stroke="#ff6b00" stroke-width="2" stroke-dasharray="4 4" fill="none" />

    <!-- Node 2: AI Processing -->
    <rect x="210" y="140" width="140" height="60" rx="8" fill="#181818" stroke="#ff6b00" stroke-width="1.5" />
    <text x="225" y="166" fill="#ff8533" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">AI AGENT</text>
    <text x="225" y="186" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">Claude 3.5 Sonnet</text>

    <!-- Connecting line 2 to 3 -->
    <path d="M 280 200 L 280 240 L 170 240 L 170 260" stroke="#ff6b00" stroke-width="2" fill="none" />

    <!-- Node 3: Storage & Notification -->
    <rect x="30" y="240" width="140" height="60" rx="8" fill="#181818" stroke="#333333" stroke-width="1" />
    <text x="45" y="266" fill="#00d26a" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">DESTINATION</text>
    <text x="45" y="286" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">PostgreSQL / KV</text>
  </g>

  <!-- Bottom stat pills -->
  <g transform="translate(80, 480)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect width="180" height="48" rx="24" fill="#141417" stroke="#262626" stroke-width="1" />
      <text x="20" y="30" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">8 Guides</text>
      <text x="95" y="30" fill="#737373" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Tested</text>
    </g>

    <!-- Pill 2 -->
    <g transform="translate(195, 0)">
      <rect width="190" height="48" rx="24" fill="#141417" stroke="#262626" stroke-width="1" />
      <text x="20" y="30" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">8 Stacks</text>
      <text x="90" y="30" fill="#737373" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Supported</text>
    </g>

    <!-- Pill 3 -->
    <g transform="translate(400, 0)">
      <rect width="200" height="48" rx="24" fill="#141417" stroke="#262626" stroke-width="1" />
      <text x="20" y="30" fill="#ff6b00" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">100% Free</text>
      <text x="110" y="30" fill="#737373" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Open Source</text>
    </g>
  </g>
</svg>
